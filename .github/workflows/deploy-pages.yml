name: Build and deploy reviewed archive

on:
  push:
    branches: [codex/github-pages-release, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reviewed-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.snapshot.outputs.ready }}
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: npm ci
        working-directory: frontend
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:pages
      - name: Check handover readiness
        id: snapshot
        run: |
          if python3 scripts/pages.py validate frontend/out/archive --require-baselines; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Deployment deferred: reviewed baselines for every snapshot constructor are required. The current site stays live." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload reviewable static build
        uses: actions/upload-artifact@v4
        with:
          name: static-site-${{ github.sha }}
          path: frontend/out
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && steps.snapshot.outputs.ready == 'true'
        with: {path: frontend/out}

  deploy:
    needs: build
    # Set PAGES_DEPLOY_BRANCH to this branch after its first passing build.
    # Every constructor included in the selected snapshot must have a reviewed release.
    if: github.event_name != 'pull_request' && needs.build.outputs.ready == 'true' && github.ref_name == vars.PAGES_DEPLOY_BRANCH
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
