name: Weekly reference intake
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-reference-intake
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Collect public references for all constructors
        run: python scripts/weekly_report.py --output weekly-report
      - name: Attach report to run summary
        if: always()
        run: |
          if [ -f weekly-report/report.md ]; then
            cat weekly-report/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-references-${{ github.run_id }}
          path: weekly-report/
          if-no-files-found: warn
          retention-days: 90
