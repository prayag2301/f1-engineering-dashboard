name: Application checks
on: [push, pull_request]
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install -e './backend[dev]'
      - run: python -m pytest
        working-directory: backend
      - run: npm ci && npm run typecheck && npm run build
        working-directory: frontend
      - run: python3 scripts/configure.py && docker compose config --quiet
  blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t f1-worker -f infra/docker/Dockerfile.worker .
      - run: docker run --rm -e MODELING_ROOT=/app/modeling -e REFERENCE_ROOT=/app/references --entrypoint python f1-worker -m app.geometry_check
