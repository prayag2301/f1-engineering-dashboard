name: f1-engineering-dashboard
x-app: &app
  DATABASE_URL: postgresql://f1user:${POSTGRES_PASSWORD:-f1local}@db:5432/f1dashboard
  REDIS_URL: redis://redis:6379/0
  RELEASE_ROOT: /releases
  REFERENCE_ROOT: /app/references
  MODELING_ROOT: /app/modeling
  ADMIN_TOKEN: ${ADMIN_TOKEN:?Run python3 scripts/configure.py to create your local review credentials}
  SESSION_SECRET: ${SESSION_SECRET:?Run python3 scripts/configure.py first}
  DEBUG: "false"
  RENDER_SAMPLES: ${RENDER_SAMPLES:-128}
  BUILD_TIMEOUT_SECONDS: ${BUILD_TIMEOUT_SECONDS:-7200}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  ENABLE_DEMO_DATA: ${ENABLE_DEMO_DATA:-false}
services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: f1user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-f1local}
      POSTGRES_DB: f1dashboard
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U f1user -d f1dashboard"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: {context: ., dockerfile: infra/docker/Dockerfile.api}
    environment: *app
    command: [python, -m, app.bootstrap]
    depends_on:
      db: {condition: service_healthy}
  api:
    restart: unless-stopped
    build: {context: ., dockerfile: infra/docker/Dockerfile.api}
    environment: *app
    volumes: [releases:/releases]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    restart: unless-stopped
    build: {context: ., dockerfile: infra/docker/Dockerfile.web}
    environment:
      BACKEND_URL: http://api:8000
      INTERNAL_API_URL: http://api:8000/api/v1
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on:
      api: {condition: service_healthy}
  worker:
    restart: unless-stopped
    build: {context: ., dockerfile: infra/docker/Dockerfile.worker}
    environment: *app
    volumes: [releases:/releases]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    stop_grace_period: 2m
  scheduler:
    restart: unless-stopped
    build: {context: ., dockerfile: infra/docker/Dockerfile.api}
    command: [celery, -A, app.tasks.celery_app, worker, --beat, --queues=scheduler, --pool=solo, --concurrency=1, --loglevel=INFO, --schedule=/schedule/celerybeat]
    environment: *app
    volumes: [schedule:/schedule]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
volumes:
  pgdata:
  redisdata:
  releases:
  schedule:
